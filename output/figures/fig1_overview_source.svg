  <g transform="translate(60 0)">

  
  <g id="L1">
    <rect x="70" y="50" width="760" height="205" rx="10" fill="#FFFFFF" stroke="#9A958B" stroke-width="1"></rect>
    <path d="M70,60 q0,-10 10,-10 h740 q10,0 10,10 v34 H70 Z" fill="#F4F2ED"></path>

    
    <text x="92" y="70" font-size="12" font-weight="700" letter-spacing="1.4" fill="#5C564E">LAYER 1</text>
    <text x="92" y="86" font-size="14" font-weight="600" fill="#2A2622">Within-group signaling</text>

    <text x="450" y="115" font-size="12.5" fill="#3F3D38" text-anchor="middle">
      Each construction act is a costly, publicly witnessed contribution:
    </text>
    <text x="450" y="130" font-size="12.5" fill="#3F3D38" text-anchor="middle">
      a credibility-enhancing display (CRED).
    </text>

    

    
    <text x="138" y="186" font-size="11" font-style="italic" fill="#5C564E" text-anchor="middle">private capacity <tspan font-weight="600">q</tspan></text>
    <text x="138" y="199" font-size="10.5" font-style="italic" fill="#5C564E" text-anchor="middle">hidden; figures identical</text>
    <path d="M150,205 C172,213 188,217 202,221" fill="none" stroke="#8A867C" stroke-width="0.7" stroke-dasharray="2.5,2" marker-end="url(#aM)"></path>

    
    <g>
