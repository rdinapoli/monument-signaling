    <line x1="190" y1="234" x2="660" y2="234" stroke="#9A958B" stroke-width="0.7"></line>

    
    <text x="450" y="158" font-size="11.5" font-style="italic" fill="#5C564E" text-anchor="middle">
      Contribution scales with capacity (Spence separating equilibrium)
    </text>
  </g>

  
  
