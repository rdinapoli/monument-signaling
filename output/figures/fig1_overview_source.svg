  <path d="M450,288 L450,314" fill="none" stroke="#2A2622" stroke-width="1.8" marker-end="url(#aK)"></path>
  <text x="436" y="305" font-size="11.5" font-style="italic" fill="#5C564E" text-anchor="end">
    construction acts accumulate
  </text>

  
  <g transform="translate(450 445)">
    <use xlink:href="#mon-big"></use>
  </g>

  <text x="450" y="475" font-size="15" font-weight="700" fill="#2A2622" text-anchor="middle">
    Monument <tspan font-style="italic" font-weight="400">M</tspan><tspan font-style="italic" font-weight="400" font-size="11" baseline-shift="sub">g</tspan>
  </text>
  <text x="450" y="491" font-size="12" font-style="italic" fill="#5C564E" text-anchor="middle">
    accumulated evidence of collective construction
  </text>

  
  <text x="700" y="350" font-size="11.5" font-style="italic" fill="#5C564E">peers see it,</text>
  <text x="700" y="363" font-size="11.5" font-style="italic" fill="#5C564E">positional reward β₀</text>
  <path d="M695,358 C650,360 585,382 518,400" fill="none" stroke="#5C564E" stroke-width="0.9" stroke-dasharray="3,3" marker-end="url(#aM)"></path>

  
  
  <path d="M372,427 C312,477 262,522 240,562" fill="none" stroke="#B5563F" stroke-width="1.8" marker-end="url(#aT)"></path>
  <text x="195" y="492" font-size="11.5" font-style="italic" fill="#B5563F" text-anchor="middle">rivals read it</text>

  
  <path d="M528,427 C588,477 638,522 660,562" fill="none" stroke="#2E5C8A" stroke-width="1.8" marker-end="url(#aB)"></path>
  <text x="705" y="492" font-size="11.5" font-style="italic" fill="#2E5C8A" text-anchor="middle">partners read it</text>

  
  <g id="L2a">
    <rect x="70" y="577" width="370" height="220" rx="10" fill="#FFFFFF" stroke="#B5563F" stroke-width="1.1"></rect>
    <path d="M70,587 q0,-10 10,-10 h350 q10,0 10,10 v34 H70 Z" fill="#F4E5DF"></path>

    <text x="92" y="597" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7A3525">LAYER 2</text>
    <text x="92" y="613" font-size="14" font-weight="600" fill="#7A3525">Competition</text>

    <text x="255" y="640" font-size="11.5" fill="#3F3D38" text-anchor="middle">
      A rival assesses the group&#39;s strength
    </text>
    <text x="255" y="654" font-size="11.5" fill="#3F3D38" text-anchor="middle">
      and judges a fight too costly to risk.
    </text>

    <g transform="translate(255 702)">
      <g transform="scale(0.35)">
        <use xlink:href="#mon-mini"></use>
      </g>
      
      <use xlink:href="#p" x="-58" y="-3"></use>
      <use xlink:href="#p" x="-46" y="-3"></use>
      
      <use xlink:href="#p" x="68" y="-3"></use>
      <use xlink:href="#p" x="80" y="-3"></use>
      
      <path d="M64,-14 L40,-14" fill="none" stroke="#B5563F" stroke-width="1.5" marker-end="url(#aT)"></path>
      <path d="M30,-20 L30,-8" fill="none" stroke="#B5563F" stroke-width="2.2" stroke-linecap="round"></path>
      
      <text x="-29" y="15" font-size="10.5" font-style="italic" fill="#5C564E" text-anchor="middle">home group</text>
      <text x="74" y="15" font-size="10.5" font-style="italic" fill="#7A3525" text-anchor="middle">rivals</text>
    </g>

    <rect x="95" y="745" width="320" height="42" rx="6" fill="#B5563F"></rect>
    <text x="255" y="764" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Conflict between groups falls
    </text>
    <text x="255" y="778" font-size="11" font-style="italic" fill="#F4E5DF" text-anchor="middle">
      war-avoidance fraction r &gt; 0
    </text>
  </g>

  <g id="L2b">
    <rect x="460" y="577" width="370" height="220" rx="10" fill="#FFFFFF" stroke="#2E5C8A" stroke-width="1.1"></rect>
    <path d="M460,587 q0,-10 10,-10 h350 q10,0 10,10 v34 H460 Z" fill="#E3ECF4"></path>

    <text x="482" y="597" font-size="12" font-weight="700" letter-spacing="1.4" fill="#244360">LAYER 3</text>
    <text x="482" y="613" font-size="14" font-weight="600" fill="#244360">Cooperation</text>

    <text x="645" y="640" font-size="11.5" fill="#3F3D38" text-anchor="middle">
      Partners see a reliable group;
    </text>
    <text x="645" y="654" font-size="11.5" fill="#3F3D38" text-anchor="middle">
      exchange and alliance ties form.
    </text>

    <g transform="translate(645 702)">
      <g transform="scale(0.35)">
        <use xlink:href="#mon-mini"></use>
      </g>
      <use xlink:href="#p" x="-78" y="-3"></use>
      <use xlink:href="#p" x="-66" y="-3"></use>
      <use xlink:href="#p" x="66" y="-3"></use>
      <use xlink:href="#p" x="78" y="-3"></use>
      
      <path d="M-52,-22 Q0,-40 52,-22" fill="none" stroke="#2E5C8A" stroke-width="1.6" marker-start="url(#aBs)" marker-end="url(#aB)"></path>
      <rect x="-3" y="-38" width="6" height="5" rx="0.6" fill="#B8B0A3" stroke="#5C564E" stroke-width="0.4"></rect>
      
      <text x="-72" y="15" font-size="10.5" font-style="italic" fill="#5C564E" text-anchor="middle">home group</text>
      <text x="72" y="15" font-size="10.5" font-style="italic" fill="#244360" text-anchor="middle">partners</text>
    </g>

    <rect x="485" y="745" width="320" height="42" rx="6" fill="#2E5C8A"></rect>
    <text x="645" y="764" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Cooperation networks buffer crises
    </text>
    <text x="645" y="778" font-size="11" font-style="italic" fill="#E3ECF4" text-anchor="middle">
      survival differential <tspan>α</tspan><tspan font-size="8.5" baseline-shift="sub">eff</tspan> &lt; <tspan>β</tspan><tspan font-size="8.5" baseline-shift="sub">eff</tspan>
    </text>
  </g>

  
  <g stroke="#2A2622" stroke-width="0.9" fill="none">
    <path d="M255,797 L255,822 L645,822 L645,797"></path>
    <path d="M450,822 L450,840" marker-end="url(#aK)"></path>
  </g>

  
  <rect x="70" y="847" width="760" height="50" rx="10" fill="#FBF6E9" stroke="#CBB97F" stroke-width="1.1"></rect>
  <text x="450" y="869" font-size="13" font-weight="700" fill="#34342E" text-anchor="middle">
    Monuments arise from individual signaling within groups, not from coercion or group-level selection.
  </text>
  <text x="450" y="886" font-size="11.5" fill="#4A4A42" text-anchor="middle">
    Within-group peer rewards drive construction; between-group audiences add deterrence and exchange benefits.
  </text>

  
  <g stroke="#2E7D5B" fill="none" stroke-width="1.6">
    <path d="M56,556 C40,470 40,330 56,262" marker-start="url(#aG)" marker-end="url(#aG)"></path>
  </g>
  <text x="-6" y="382" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E7D5B">Environmental</text>
  <text x="-6" y="396" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E7D5B">uncertainty</text>
  <text x="-6" y="412" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2E7D5B">raises the value</text>
  <text x="-6" y="424" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2E7D5B">of deterrence</text>
  <text x="-6" y="436" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2E7D5B">and cooperation</text>

  <g stroke="#B07A22" fill="none" stroke-width="1.6">
    <path d="M832,690 C880,640 880,360 874,300 C868,250 882,212 834,208" marker-end="url(#aO)"></path>
  </g>
  <text x="800" y="284" font-size="11.5" font-weight="700" fill="#B07A22" text-anchor="middle">Reinforcement</text>
  <text x="800" y="298" font-size="10.5" font-style="italic" fill="#B07A22" text-anchor="middle">Layer 2 and 3 benefits raise</text>
  <text x="800" y="310" font-size="10.5" font-style="italic" fill="#B07A22" text-anchor="middle">group fitness, sustaining</text>
  <text x="800" y="322" font-size="10.5" font-style="italic" fill="#B07A22" text-anchor="middle">the practice</text>

  </g>
</svg>