[project]
name = "monument-signaling"
version = "0.1.0"
description = "Analytical models for the multilevel costly signaling framework"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signaling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
